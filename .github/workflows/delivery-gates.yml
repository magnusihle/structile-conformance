name: delivery-gates

on:
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Vendored delivery tooling matches the planning pin
        run: sha256sum -c delivery/planning-pin.sha256
      - name: PR size ceilings (DEL-002)
        run: node tooling/check-pr-size.mjs "origin/${{ github.base_ref }}"
