name: delivery-gates

on:
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Vendored delivery tooling matches the planning pin
        run: sha256sum -c delivery/planning-pin.sha256
      - name: PR size ceilings (DEL-002)
        run: node tooling/check-pr-size.mjs "origin/${BASE_REF}"
