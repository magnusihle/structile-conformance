name: Protected G1 verifier

run-name: G1 ${{ inputs.core_sha }} / Northstar ${{ inputs.northstar_sha }}

on:
  workflow_dispatch:
    inputs:
      core_sha:
        description: Exact 40-character Structile main commit
        required: true
        type: string
      northstar_sha:
        description: Exact 40-character Northstar main commit
        required: true
        type: string
      suites:
        description: Optional comma-separated G1 test IDs for a partial run; gate closure requires a full run
        required: false
        default: ""
        type: string

permissions:
  attestations: write
  contents: read
  id-token: write
  packages: write

concurrency:
  group: protected-g1-verifier
  cancel-in-progress: false

jobs:
  verify:
    name: Protected G1 evidence
    environment: protected-verifier
    runs-on: ubuntu-24.04
    # GitHub-hosted maximum; catalog worst-case serial budgets exceed even this,
    # so long suites are expected to run via partial dispatch (suites input).
    timeout-minutes: 360
    env:
      CORE_SHA: ${{ inputs.core_sha }}
      NORTHSTAR_SHA: ${{ inputs.northstar_sha }}
      SUITES_FILTER: ${{ inputs.suites }}
    steps:
      - name: Check out protected conformance authority
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          path: conformance
          persist-credentials: false

      - name: Install pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: conformance/.nvmrc

      - name: Mint the constrained builder probe token
        id: builder-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.STRUCTILE_BUILDER_APP_ID }}
          private-key: ${{ secrets.STRUCTILE_BUILDER_APP_PRIVATE_KEY }}
          owner: magnusihle
          repositories: |
            structile
            structile-northstar
          permission-contents: write
          permission-pull-requests: write

      - name: Check out exact core candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: magnusihle/structile
          ref: ${{ inputs.core_sha }}
          fetch-depth: 0
          path: core
          persist-credentials: false
          token: ${{ steps.builder-token.outputs.token }}

      - name: Check out exact private Northstar candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: magnusihle/structile-northstar
          ref: ${{ inputs.northstar_sha }}
          fetch-depth: 0
          path: northstar
          persist-credentials: false
          token: ${{ steps.builder-token.outputs.token }}

      - name: Verify immutable candidate identities
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CORE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$NORTHSTAR_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git -C conformance rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          test "$(git -C northstar rev-parse HEAD)" = "$NORTHSTAR_SHA"
          test -z "$(git -C conformance status --porcelain)"
          test -z "$(git -C core status --porcelain)"
          test -z "$(git -C northstar status --porcelain)"

      - name: Install frozen dependencies and run candidate checks
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --prefix conformance
          npm ci --ignore-scripts --prefix core
          npm ci --ignore-scripts --prefix northstar
          npm run check --prefix conformance
          npm run check --prefix core
          npm run check --prefix northstar

      - name: Compute catalog-driven G1 dispatch plan
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          node - > "$RUNNER_TEMP/g1-plan.json" <<'NODE'
          const { readFileSync } = require("node:fs");
          const catalog = JSON.parse(readFileSync("conformance/verification/test-catalog.json", "utf8"));
          const plan = [];
          for (const test of catalog.tests) {
            if (test.gate !== "G1") continue;
            const parts = test.command.split(/\s+/);
            if (parts[0] !== "platform-conformance" || parts[1] !== "run" || !parts[2]) {
              throw new Error(`unsupported catalog command for ${test.id}: ${test.command}`);
            }
            const args = parts.slice(3).filter((value, index, all) =>
              value !== "--candidate" && all[index - 1] !== "--candidate");
            for (const value of args) {
              if (!/^[A-Za-z0-9.,_/=-]+$/.test(value)) throw new Error(`unsafe argument in ${test.id}: ${value}`);
            }
            plan.push({ id: test.id, slug: parts[2], args });
          }
          if (plan.length === 0) throw new Error("no G1 tests found in catalog");
          const filter = (process.env.SUITES_FILTER ?? "").split(",").map((value) => value.trim()).filter(Boolean);
          let selected = plan;
          if (filter.length > 0) {
            const known = new Set(plan.map((entry) => entry.id));
            for (const id of filter) {
              if (!known.has(id)) throw new Error(`requested suite ${id} is not a G1 catalog test`);
            }
            selected = plan.filter((entry) => filter.includes(entry.id));
          }
          process.stdout.write(JSON.stringify(selected));
          NODE
          expected=$(jq -r '[.[].id] | sort | join(",")' "$RUNNER_TEMP/g1-plan.json")
          count=$(jq length "$RUNNER_TEMP/g1-plan.json")
          mode=full
          if [ -n "$SUITES_FILTER" ]; then mode=partial; fi
          echo "Dispatch plan ($mode): $count suites -> $expected"
          echo "expected-ids=$expected" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and push exact conformance runner
        id: image
        shell: bash
        working-directory: conformance
        run: |
          set -euo pipefail
          image_name='ghcr.io/magnusihle/structile-conformance'
          image_tag="sha-${GITHUB_SHA}"
          image_ref="${image_name}:${image_tag}"
          docker build --file Containerfile --tag "$image_ref" .
          docker push "$image_ref"
          repository_digest=$(docker image inspect "$image_ref" --format '{{index .RepoDigests 0}}')
          digest=${repository_digest#*@}
          test "$repository_digest" = "${image_name}@${digest}"
          test "${#digest}" -eq 71
          docker run --rm "$repository_digest" list
          echo "name=$image_name" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "reference=$repository_digest" >> "$GITHUB_OUTPUT"

      - name: Attest conformance runner image
        id: image-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Verify runner image provenance
        shell: bash
        env:
          ATTESTATION_BUNDLE: ${{ steps.image-attestation.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
          RUNNER_REFERENCE: ${{ steps.image.outputs.reference }}
        run: |
          set -euo pipefail
          gh attestation verify "oci://$RUNNER_REFERENCE" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/protected-g1-verifier.yml" \
            --source-ref refs/heads/main \
            --source-digest "$GITHUB_SHA" \
            --bundle "$ATTESTATION_BUNDLE" \
            --format json > "$RUNNER_TEMP/runner-attestation-verification.json"

      - name: Create evidence workspace
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="${RUNNER_TEMP}/g1-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          bundle_path="${RUNNER_TEMP}/structile-g1-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
          mkdir -p "$evidence_dir"
          echo "directory=$evidence_dir" >> "$GITHUB_OUTPUT"
          echo "bundle=$bundle_path" >> "$GITHUB_OUTPUT"

      - name: Dispatch every catalog G1 suite
        shell: bash
        env:
          EVIDENCE_DIR: ${{ steps.evidence.outputs.directory }}
          RUNNER_REFERENCE: ${{ steps.image.outputs.reference }}
          STRUCTILE_ATTESTATION_REF: ${{ steps.image-attestation.outputs.attestation-url }}
          STRUCTILE_CONFORMANCE_HARDWARE: github-hosted-ubuntu-24.04
          STRUCTILE_CONFORMANCE_PROFILE: protected-g1
          STRUCTILE_CONFORMANCE_REGION: github
          STRUCTILE_NORTHSTAR_CHECKOUT: ${{ github.workspace }}/northstar
          STRUCTILE_RUNNER_IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          STRUCTILE_WORKFLOW_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/protected-g1-verifier.yml@${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/conformance-home" "$RUNNER_TEMP/conformance-tmp"
          docker_socket_gid=$(stat -c '%g' /var/run/docker.sock)
          runner=(
            docker run --rm --read-only --network none
            --cap-drop ALL --security-opt no-new-privileges
            --user "$(id -u):$(id -g)" --group-add "$docker_socket_gid"
            --volume /var/run/docker.sock:/var/run/docker.sock:ro
            --volume "$GITHUB_WORKSPACE/core:$GITHUB_WORKSPACE/core"
            --volume "$GITHUB_WORKSPACE/northstar:$GITHUB_WORKSPACE/northstar:ro"
            --volume "$RUNNER_TEMP:$RUNNER_TEMP"
            --env "HOME=$RUNNER_TEMP/conformance-home"
            --env "TMPDIR=$RUNNER_TEMP/conformance-tmp"
            --env "STRUCTILE_ATTESTATION_REF=$STRUCTILE_ATTESTATION_REF"
            --env "STRUCTILE_CONFORMANCE_HARDWARE=$STRUCTILE_CONFORMANCE_HARDWARE"
            --env "STRUCTILE_CONFORMANCE_PROFILE=$STRUCTILE_CONFORMANCE_PROFILE"
            --env "STRUCTILE_CONFORMANCE_REGION=$STRUCTILE_CONFORMANCE_REGION"
            --env "STRUCTILE_NORTHSTAR_CHECKOUT=$STRUCTILE_NORTHSTAR_CHECKOUT"
            --env "STRUCTILE_RUNNER_IMAGE_DIGEST=$STRUCTILE_RUNNER_IMAGE_DIGEST"
            --env "STRUCTILE_WORKFLOW_IDENTITY=$STRUCTILE_WORKFLOW_IDENTITY"
            --env GITHUB_RUN_ID --env GITHUB_RUN_ATTEMPT
            "$RUNNER_REFERENCE"
          )
          while IFS= read -r entry; do
            suite_id=$(jq -r .id <<<"$entry")
            slug=$(jq -r .slug <<<"$entry")
            mapfile -t extra < <(jq -r '.args[]' <<<"$entry")
            echo "::group::${suite_id} (${slug})"
            mkdir -p "$EVIDENCE_DIR/$suite_id"
            "${runner[@]}" run "$slug" ${extra[@]+"${extra[@]}"} \
              --candidate "$GITHUB_WORKSPACE/core" \
              --evidence-dir "$EVIDENCE_DIR/$suite_id"
            echo "::endgroup::"
          done < <(jq -c '.[]' "$RUNNER_TEMP/g1-plan.json")

      - name: Validate complete protected G1 evidence set
        shell: bash
        env:
          EVIDENCE_DIR: ${{ steps.evidence.outputs.directory }}
          EXPECTED_COUNT: ${{ steps.plan.outputs.count }}
          EXPECTED_IDS: ${{ steps.plan.outputs.expected-ids }}
          RUNNER_REFERENCE: ${{ steps.image.outputs.reference }}
          RUNNER_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          # Per-suite subdirectories: each suite may emit exactly one envelope, and
          # only for its own test ID — a suite cannot forge a sibling's evidence.
          validated=0
          while IFS= read -r entry; do
            suite_id=$(jq -r .id <<<"$entry")
            mapfile -d '' suite_files < <(find "$EVIDENCE_DIR/$suite_id" -name evidence.json -type f -print0)
            test "${#suite_files[@]}" -eq 1
            evidence_file="${suite_files[0]}"
            test "$(jq -r .testId "$evidence_file")" = "$suite_id"
            test "$(jq -r .status "$evidence_file")" = passed
            test "$(jq -r .exitCode "$evidence_file")" = 0
            test "$(jq -r .candidate.commitSha "$evidence_file")" = "$CORE_SHA"
            test "$(jq -r .runner.imageDigest "$evidence_file")" = "$RUNNER_DIGEST"
            test "$(jq -r '.measurements.localUnsigned' "$evidence_file")" = false
            docker run --rm --read-only --network none \
              --cap-drop ALL --security-opt no-new-privileges \
              --user "$(id -u):$(id -g)" \
              --volume "$RUNNER_TEMP:$RUNNER_TEMP:ro" \
              "$RUNNER_REFERENCE" verify-evidence "$evidence_file" \
              --candidate-sha "$CORE_SHA" \
              --runner-digest "$RUNNER_DIGEST"
            validated=$((validated + 1))
          done < <(jq -c '.[]' "$RUNNER_TEMP/g1-plan.json")
          test "$validated" -eq "$EXPECTED_COUNT"
          stray_count=$(find "$EVIDENCE_DIR" -name evidence.json -type f | wc -l)
          test "$stray_count" -eq "$EXPECTED_COUNT"
          actual_ids=$(find "$EVIDENCE_DIR" -name evidence.json -type f -print0 | xargs -0 -n1 jq -r .testId | sort | paste -sd, -)
          test "$actual_ids" = "$EXPECTED_IDS"

      - name: Create deterministic evidence bundle
        shell: bash
        env:
          BUNDLE_PATH: ${{ steps.evidence.outputs.bundle }}
          EVIDENCE_DIR: ${{ steps.evidence.outputs.directory }}
        run: |
          set -euo pipefail
          staging="${RUNNER_TEMP}/g1-bundle-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$staging"
          cp -R "$EVIDENCE_DIR" "$staging/evidence"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -C "$staging" -czf "$BUNDLE_PATH" .
          sha256sum "$BUNDLE_PATH"

      - name: Attest protected evidence bundle
        id: evidence-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ steps.evidence.outputs.bundle }}

      - name: Verify evidence bundle provenance
        shell: bash
        env:
          ATTESTATION_BUNDLE: ${{ steps.evidence-attestation.outputs.bundle-path }}
          BUNDLE_PATH: ${{ steps.evidence.outputs.bundle }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation verify "$BUNDLE_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/protected-g1-verifier.yml" \
            --source-ref refs/heads/main \
            --source-digest "$GITHUB_SHA" \
            --bundle "$ATTESTATION_BUNDLE" \
            --format json > "$RUNNER_TEMP/evidence-attestation-verification.json"

      - name: Upload protected evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: protected-g1-evidence-${{ inputs.core_sha }}${{ inputs.suites != '' && '-partial' || '' }}
          if-no-files-found: error
          retention-days: 90
          path: |
            ${{ steps.evidence.outputs.directory }}
            ${{ steps.evidence.outputs.bundle }}
            ${{ steps.image-attestation.outputs.bundle-path }}
            ${{ steps.evidence-attestation.outputs.bundle-path }}
            ${{ runner.temp }}/runner-attestation-verification.json
            ${{ runner.temp }}/evidence-attestation-verification.json
            ${{ runner.temp }}/g1-plan.json

      - name: Record attestation references
        shell: bash
        env:
          CONFORMANCE_SHA: ${{ github.sha }}
          EVIDENCE_ATTESTATION_URL: ${{ steps.evidence-attestation.outputs.attestation-url }}
          EXPECTED_IDS: ${{ steps.plan.outputs.expected-ids }}
          IMAGE_ATTESTATION_URL: ${{ steps.image-attestation.outputs.attestation-url }}
          RUNNER_REFERENCE: ${{ steps.image.outputs.reference }}
        run: |
          {
            echo '## Protected G1 evidence'
            echo
            printf '%s\n' "- Mode: \`${{ steps.plan.outputs.mode }}\` (gate closure requires a full run)"
            printf '%s\n' "- Core candidate: \`$CORE_SHA\`"
            printf '%s\n' "- Conformance authority: \`$CONFORMANCE_SHA\`"
            printf '%s\n' "- Northstar candidate: \`$NORTHSTAR_SHA\`"
            printf '%s\n' "- Runner: \`$RUNNER_REFERENCE\`"
            printf '%s\n' "- Suites: \`$EXPECTED_IDS\`"
            echo "- Runner attestation: $IMAGE_ATTESTATION_URL"
            echo "- Evidence attestation: $EVIDENCE_ATTESTATION_URL"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: failed-g1-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            ${{ steps.evidence.outputs.directory }}
            ${{ runner.temp }}/g1-plan.json

      - name: Log out of GHCR
        if: always()
        shell: bash
        run: docker logout ghcr.io || true
